<!DOCTYPE html>
<html>
    <head>
        <title>Form and inputes</title>
    </head>

    <body>
        <!--form and inputs-->
        <Form>
            <p>
            <label for="name">Name</label><br>
            <input type="text" id="name" name="name" placeholder = "Enter the name">
            </p>

            <p>
                <label for="email"> Email</label><br>
                <input type="email" id="email">
            </p>

            <p>
                <label for="password"> Password</label><br>
                <input type="password" id ="password">
            </p>

            <p>
                <label for="age">Age</label><br>
                <input type="number" id="age">
            </p>

            <p>
                <label for ="birthdate">Birthdate</label><br>
                <input type="Date" id ="Birthdate">
            </p>
            <P>
                <label for ="message">Message</label><br>
                <textarea name="message" id ="Message"cols="50" roes="5"></textarea>
            </P>

            <p>
                <label for="gender">Gender</label><br>
                <select name="gender" id ="gender">

                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <p>
                <label for="hobbies">Hobbies</label><br>
                <input type="radio" name ="hobbies" value="Date"><br>
                <input type="radio" name ="hobbies" value="Dancing"><br>
                <input type="radio" name ="hobbies" value="Singing"><br>
                
            </p>
        </Form>
    </body>

</html>
