<!DOCTYPE html>
<html>
<head>
    <title>List and Tables</title>
</head>
<body>

    <!--unorder list-->
    <ul>
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li>
    </ul>

    <!--ordered list-->
    <ol>
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li>
        
    </ol>

    <!--nested list-->

    <ol type="A">

        <u1>
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li> 
        </u1>
     
    <!--Table-->

    <table>

        <thead>
            <tr>
                <th> Name </th>
                <th> Id </th>
                <th> Age </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Akshu</td>
                <td>003</td>
                <td>18</td>
            </tr>

            <tr>
                <td>Deepu</td>
                <td>008</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Lakki</td>
                <td>043</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
